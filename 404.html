<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ===== GENERATED: this file is index.html plus the script below. =====
       GitHub Pages serves 404.html for any address with no file behind it,
       which is how /house can be a page without /house.html existing. Rebuild
       it after editing index.html:

           python3 make404.py

       Nothing else in here should be edited by hand. -->
  <script>
    // Served for an address that has no file, so the last segment is a page
    // name rather than a folder. A trailing slash would make every relative
    // asset below resolve one level too deep and the app would arrive with no
    // stylesheet and no script — so drop it before the browser starts fetching.
    if (location.pathname.length > 1 && location.pathname.endsWith("/")) {
      location.replace(
        location.pathname.slice(0, -1) + location.search + location.hash
      );
    }
  </script>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta id="theme-color" name="theme-color" content="#f5f1e9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Plaint" />
  <title>Plaint</title>
  <!-- Link previews. Scrapers read this file as it is, running nothing, so
       the card a shared link shows is decided right here. The image is the
       launcher icon, and it is the one address in the app that must be
       absolute — a crawler cannot be handed a relative URL. -->
  <meta
    name="description"
    content="A plain painting web app for kids, artists, and doodlers."
  />
  <meta property="og:title" content="Plaint" />
  <meta
    property="og:description"
    content="A plain painting web app for kids, artists, and doodlers."
  />
  <meta
    property="og:image"
    content="https://zaffer.github.io/colour-webapp/icons/icon-512.png"
  />
  <meta property="og:url" content="https://zaffer.github.io/colour-webapp/" />
  <meta name="twitter:card" content="summary" />
  <!-- Installable app: the manifest gives it a name and icons on a home
       screen, and sw.js — registered from app.js — keeps a copy of everything
       so it opens with no network. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <!-- The logo is the Poster tray itself: four round daubs, one to a corner,
       each painted over the one before. Same picture as icons/, which
       makeicons.mjs draws. -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='11' r='8' fill='%23e0356b'/%3E%3Ccircle cx='21' cy='11' r='8' fill='%232b6fe5'/%3E%3Ccircle cx='11' cy='21' r='8' fill='%232ca24a'/%3E%3Ccircle cx='21' cy='21' r='8' fill='%23f1c40f'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The drawing surface is transparent; the "paper" is this element's CSS
       background, so switching theme recolours the paper instantly. -->
  <canvas id="board" aria-label="Drawing board"></canvas>

  <!-- Settings: a single gear, top-left, opening a tiny menu. -->
  <div id="settings" class="settings">
    <button id="settings-toggle" class="icon-btn" aria-label="Settings" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="5" r="2" />
        <circle cx="12" cy="12" r="2" />
        <circle cx="12" cy="19" r="2" />
      </svg>
    </button>
    <div id="settings-menu" class="settings-menu" hidden>
      <!-- Reads out the mode in force; applyTheme swaps it, so this is only the
           light-mode starting point. -->
      <button id="btn-dark" class="menu-item">☀️ Light mode</button>
      <button id="btn-fullscreen" class="menu-item">🖥️ Fullscreen</button>
      <button id="btn-save" class="menu-item">💾 Save picture</button>

      <div class="menu-sep" aria-hidden="true"></div>
      <div class="menu-cap" aria-hidden="true">Colours</div>
      <!-- One row per colourway, filled in by app.js from PALETTES so the dots
           on each row are always that set's actual pigments. -->
      <div id="menu-sets" class="menu-sets" role="radiogroup" aria-label="Colours"></div>
      <!-- Under the trays because it belongs with them: how colours behave where
           they meet, cycled none / light / paint. Still independent of which
           tray is chosen — any set can be mixed any way. -->
      <button id="btn-mix" class="menu-item">🔀 Mixing: light</button>

      <div class="menu-sep" aria-hidden="true"></div>
      <div class="menu-cap" aria-hidden="true">Pages</div>
      <!-- Every page visited so far, filled in by app.js. A page is made by
           typing a name on the end of the address, so this is a record of where
           you have been rather than something to keep tidy. -->
      <div id="menu-pages" class="menu-pages" role="radiogroup" aria-label="Pages"></div>
      <button id="btn-add-page" class="menu-item">➕ Add page</button>
      <button id="btn-del-page" class="menu-item menu-item--danger">❌ Delete page</button>

      <!-- Shelved for now: pages cover the want it served, since a clean sheet
           is Add page rather than emptying this one. The trailing separator goes
           with it, or the menu ends on a rule with nothing under it. Its click
           handler in app.js is commented out to match — restore both together.
      <div class="menu-sep" aria-hidden="true"></div>

      <button id="btn-clear" class="menu-item menu-item--danger">🗑️ Start over</button>
      -->
    </div>
  </div>

  <!-- Mixing palette: the same card as the toolbar, parked directly behind it.
       Lifting the toolbar by its handle slides it clear and reveals this. It is
       a paint surface in its own right — daub two colours, scrub them together,
       then lift the result off it with the eyedropper. -->
  <div id="palette" class="palette" role="group" aria-label="Mixing palette">
    <canvas id="palette-board" class="palette-board" aria-label="Mixing surface"></canvas>
    <button
      id="btn-pick"
      class="swatch swatch--pick"
      data-pick
      aria-label="Pick a colour"
      aria-pressed="false"
    >🎨</button>
  </div>

  <!-- Tools: colours + eraser on top, pen size across the bottom. -->
  <div id="toolbar" class="toolbar">
    <!-- Grab-bar. Drag it down and the whole panel follows your finger, then
         snaps below the bottom edge leaving just this handle showing; drag it
         back up — or tap it — and the panel returns to its usual spot. -->
    <button
      id="tb-handle"
      class="tb-handle"
      aria-label="Hide tools"
      aria-expanded="true"
      aria-controls="toolbar"
    >
      <span class="tb-grip" aria-hidden="true"></span>
    </button>

    <div class="colors" role="radiogroup" aria-label="Colour">
      <!-- The contrast pigment: whichever of black and white reads against the
           paper, so it is black here and white in dark mode. applyTheme() swaps
           its colour and label — the attributes below are only the light-mode
           starting point, the way the size and amount inputs carry theirs. It
           is a real pigment and mixes like one: black shades a colour, white
           tints it, which is the pair the palette was missing. -->
      <button class="swatch swatch--contrast" data-contrast data-color="#000000" style="--c:#000000" role="radio" aria-checked="false" aria-label="Black"></button>
      <!-- The pigments in between are rendered here by app.js from the chosen
           colourway — see PALETTES, which carries the reasoning for each set.
           Only the contrast pigment and the eraser are fixed, because those two
           belong to every set. -->
      <button class="swatch swatch--eraser" data-eraser role="radio" aria-checked="false" aria-label="Eraser">🧹</button>
    </div>
    <div class="slider">
      <!-- Wedge grows to the right to show the pen gets bigger that way. -->
      <div class="slider-wedge" aria-hidden="true"></div>
      <!-- Our own knob: positioned so its CENTRE reaches the rims. The native
           range thumb below is invisible and only drives interaction. -->
      <div class="slider-knob" aria-hidden="true"></div>
      <input
        id="size"
        class="size"
        type="range"
        min="4"
        max="80"
        value="24"
        step="1"
        aria-label="Pen size"
      />
      <!-- Paint amount has no track of its own: it is the slider's vertical
           axis, shown by the fill inside the knob. This exists so the keyboard
           and assistive tech can still reach it. Sixteen steps of 16 ending on
           255, so any amount builds up to exactly full — see LAYER_ADD. -->
      <input
        id="amount"
        class="a11y-only"
        type="range"
        min="15"
        max="255"
        value="207"
        step="16"
        aria-label="Paint amount"
      />
    </div>
  </div>

  <!-- Pigment mixing: Mixbox preferred, spectral.js as MIT fallback.
       See THIRD-PARTY-NOTICES.md — deleting mixbox.js makes the app all-MIT. -->
  <script src="mixbox.js"></script>
  <script src="spectral.js"></script>
  <script src="app.js"></script>
</body>
</html>
